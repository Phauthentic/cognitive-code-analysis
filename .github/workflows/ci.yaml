name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  testsuite:
    name: Unittests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            symfony-version: '6.*'
            composer-flags: '--prefer-lowest --prefer-stable'
          - php-version: '8.2'
            symfony-version: '7.*'
            composer-flags: ''
          - php-version: '8.4'
            symfony-version: '8.*'
            composer-flags: ''
          - php-version: '8.5'
            symfony-version: '8.*'
            composer-flags: ''

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: json, fileinfo
        tools: pecl
        coverage: pcov

    - name: Composer install
      run: |
        composer config minimum-stability stable
        # PHPMD (via pdepend) does not support Symfony 8 yet; it only runs in the code-analysis job
        composer remove --dev --no-update phpmd/phpmd
        composer require --no-update \
          symfony/console:${{ matrix.symfony-version }} \
          symfony/config:${{ matrix.symfony-version }} \
          symfony/yaml:${{ matrix.symfony-version }} \
          symfony/dependency-injection:${{ matrix.symfony-version }} \
          symfony/messenger:${{ matrix.symfony-version }}
        composer update --with-all-dependencies ${{ matrix.composer-flags }}

    - name: Run PHPUnit
      run: |
        if [[ ${{ matrix.php-version }} == '8.4' ]]; then
          bin/phpunit --coverage-clover=coverage.xml
        else
          bin/phpunit
        fi
    - name: Code Coverage Report
      if: success() && matrix.php-version == '8.4'
      uses: codecov/codecov-action@v4

  code-analysis:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: json, fileinfo
        coverage: pcov
        tools: pecl

    - name: Composer install
      run: composer install

    - name: Run phpcs
      run: bin/phpcs --version && bin/phpcs --report=source --standard=phpcs.xml

    - name: Run phpstan
      run: bin/phpstan -V && bin/phpstan --error-format=github

    - name: Run phpmd
      run: bin/phpmd --version && composer phpmd
