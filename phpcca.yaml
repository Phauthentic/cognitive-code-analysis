cognitive:
  excludeFilePatterns:
  excludePatterns:
  scoreThreshold: 0.5
  showOnlyMethodsExceedingThreshold: true
  showHalsteadComplexity: false
  showCyclomaticComplexity: false
  showUnderstandability: false
  showDetailedCognitiveMetrics: true
  groupByClass: true
  # Appends the columns "If Count", "If Count Weight" and "If Count Weight Delta" at the very END of
  # each CSV report row. This flag only exists to keep the CSV column positions backwards compatible
  # for consumers that read columns by index. It will be removed in the next major version, when the
  # If Count columns move to their logical position before "If Nesting Level".
  csvAppendIfCountColumns: false
  metrics:
    lineCount:
      threshold: 60
      scale: 25.0
      enabled: true
    argCount:
      threshold: 4
      scale: 1.0
      enabled: true
    returnCount:
      threshold: 2
      scale: 5.0
      enabled: true
    variableCount:
      threshold: 4
      scale: 5.0
      enabled: true
    propertyCallCount:
      threshold: 4
      scale: 15.0
      enabled: true
    ifCount:
      threshold: 3
      scale: 1.0
      enabled: true
    ifNestingLevel:
      threshold: 1
      scale: 1.0
      enabled: true
    elseCount:
      threshold: 1
      scale: 1.0
      enabled: true
  cache:
    enabled: true
    directory: './.phpcca.cache'
  # Example of custom reporters:
  # customReporters:
  #   cognitive:
  #     pdf:
  #       class: 'My\Custom\PdfReporter'
  #       file: '/path/to/PdfReporter.php'
  #     churn:
  #       class: 'My\Custom\ChurnReporter'
  #       file: '/path/to/ChurnReporter.php'
